<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <video id="background-video" class="hidden" autoplay muted loop playsinline aria-hidden="true"></video>

    <div id="app">
        <audio id="bg-music"></audio>

        <button id="music-toggle" class="hidden" aria-label="Play or pause background music" aria-pressed="false">
            <span id="music-icon" aria-hidden="true">🎵</span>
        </button>

        <section id="scene-1" class="scene active">
            <div class="pixel-envelope-container">
                <div class="pixel-envelope"></div> 
            </div>
            <p id="welcome-text" class="pixel-text"></p>
            <h1 id="welcome-name" class="pixel-title"></h1>
            <button id="btn-open" class="pixel-btn"></button>
        </section>

        <section id="scene-2" class="scene hidden">
            <h1 id="reveal-title" class="pixel-title"></h1>
            <h2 id="reveal-age" class="pixel-highlight"></h2>
            <p id="reveal-subtitle" class="pixel-text"></p>
            <div class="nav-buttons">
                <button class="pixel-btn btn-prev"></button>
                <button class="pixel-btn btn-next"></button>
            </div>
        </section>

        <section id="scene-3" class="scene hidden">
            <div class="media-wrapper pixel-border">
                <img id="main-photo" src="" alt="Main Photo">
            </div>
            <p id="main-media-caption" class="pixel-text"></p>
            <div class="nav-buttons">
                <button class="pixel-btn btn-prev"></button>
                <button class="pixel-btn btn-next"></button>
            </div>
        </section>

        <section id="scene-4" class="scene hidden">
            <div class="stationery-wrapper">
                <span class="stationery-decor decor-tl" aria-hidden="true">✦</span>
                <span class="stationery-decor decor-tr" aria-hidden="true">✿</span>
                
                <h2 id="message-title" class="pixel-title stationery-title"></h2>
                <div class="stationery-divider" aria-hidden="true"></div>
                
                <div id="message-body" class="stationery-body"></div>
                
                <span class="stationery-decor decor-bl" aria-hidden="true">✿</span>
                <span class="stationery-decor decor-br" aria-hidden="true">✦</span>
            </div>
            <div class="nav-buttons">
                <button class="pixel-btn btn-prev"></button>
                <button class="pixel-btn btn-next"></button>
            </div>
        </section>

        <section id="scene-5" class="scene hidden">
            <h2 id="memories-title" class="pixel-title"></h2>
            <div class="memories-grid">
                <div class="memory-card pixel-border">
                    <img id="memory-1-img" src="" alt="Memory 1">
                    <p id="memory-1-caption" class="pixel-text"></p>
                </div>
                <div class="memory-card pixel-border">
                    <img id="memory-2-img" src="" alt="Memory 2">
                    <p id="memory-2-caption" class="pixel-text"></p>
                </div>
            </div>
            <div class="nav-buttons">
                <button class="pixel-btn btn-prev"></button>
                <button class="pixel-btn btn-next"></button>
            </div>
        </section>

        <section id="scene-6" class="scene hidden">
            <h2 id="closing-text" class="pixel-title"></h2>
            <p id="sender-name" class="pixel-highlight"></p>
            <div class="nav-buttons">
                <button class="pixel-btn btn-prev"></button>
                <a id="btn-whatsapp" href="#" class="pixel-btn" target="_blank" rel="noopener noreferrer"></a>
                <button id="btn-start" class="pixel-btn"></button>
            </div>
        </section>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
